<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Journaling Man – testpagina</title>
  <style>
    :root { --bg:#111111; --fg:#f4f1ea; --muted:#9a968c; --accent:#e8c872; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: Georgia, "Times New Roman", serif; padding: 24px; text-align: center;
    }
    main { max-width: 560px; }
    .tag { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 24px; }
    h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1.1; margin-bottom: 20px; }
    p { color: var(--muted); font-size: 18px; line-height: 1.6; margin-bottom: 32px; }
    a.btn { display: inline-block; background: var(--accent); color: #111; text-decoration: none;
      font: 600 16px/1 system-ui, sans-serif; padding: 16px 28px; border-radius: 6px; }
    footer { margin-top: 48px; font: 12px/1.4 system-ui, sans-serif; color: #5d5a52; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Placeholder</div>
    <h1>Schrijf je hoofd leeg.<br>Maak de keuze.</h1>
    <p>Dit is een testpagina om de deploy-keten te checken. Als je dit live ziet, werkt de infrastructuur.</p>
    <a class="btn" href="#">Klik hier (dummy-knop)</a>
    <footer>Versie 1 &middot; gedeployed via GitHub</footer>
  </main>
</body>
</html>
